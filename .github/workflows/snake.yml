name: Generate contribution snake

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # One file per line; each output customized with query-string options.
          # color_dots = 5 colors, FIRST is the 0-contribution (empty) cell.
          # Dark: empty cell #2d3343 is a visible slate against GitHub's #0d1117
          # (a near-black empty cell would disappear and break the grid look).
          outputs: |
            dist/github-snake.svg?color_snake=0891B2&color_dots=#EBEDF0,#C9D4E8,#A78BFA,#22D3EE,#10B981
            dist/github-snake-dark.svg?color_snake=A78BFA&color_dots=#2d3343,#1E2C4C,#0891B2,#22D3EE,#10B981

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
